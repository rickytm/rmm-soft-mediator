name: Auto Tag, Release & Publish to NuGet

on:
  push:
    branches:
      - main # Cambia a master si esa es tu rama principal
    paths:
      - '**/*.csproj' # Solo se ejecuta si modificas el archivo del proyecto (cambio de versión)

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que el script cree Tags y Releases en tu cuenta

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Trae todo el historial para verificar Tags existentes

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Extract Version from .csproj
      id: get_version
      run: |
        # Busca la línea <Version>X.Y.Z</Version>, limpia los espacios y extrae el texto
        VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' *.csproj || grep -oPm1 '(?<=<Version>)[^<]+' src/**/*.csproj)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Versión detectada en el .csproj: $VERSION"

    - name: Check if Tag Exists
      id: check_tag
      run: |
        if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "El tag v${{ steps.get_version.outputs.version }} ya existe. Omitiendo despliegue."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build Project (Release)
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        dotnet restore
        dotnet build -c Release

    - name: Create GitHub Release and Tag
      if: steps.check_tag.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          Automated release for version ${{ steps.get_version.outputs.version }}.
          Check commits for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub lo genera solo, no debes configurarlo

    - name: Push Package to NuGet
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        dotnet nuget push **/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://nuget.org --skip-duplicate
